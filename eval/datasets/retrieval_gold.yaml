# Retrieval gold set — questions whose answer lives in a KNOWN block.
#
# Built by sampling the actual index (231 chunks from DemoX), not invented. A
# gold set written without looking at the corpus measures the question-writer's
# imagination rather than the retriever.
#
# `expect` lists display names any of which is a correct top hit. Several
# questions legitimately have more than one right answer — the course covers
# cohorts in both "Setting up Cohorts" and "Content groups" — and marking one
# arbitrarily correct would penalise a retriever that found the other.
#
# LIMITATION, stated up front: 18 questions is a small sample. Per design §11.2
# this yields indicative numbers with wide intervals, not a settled measurement.
# It is reported with n, never as a bare percentage.

offering_id: "course-v1:OpenedX+DemoX+DemoCourse"

questions:
  - id: q01
    question: "What are video transcripts used for?"
    expect: ["Transcripts", "Best Practices & Generating SRT Files"]
    covered: true

  - id: q02
    question: "How do I set up cohorts in my course?"
    expect: ["Setting up Cohorts", "Content groups"]
    covered: true

  - id: q03
    question: "What is an Open Response Assessment?"
    expect: ["ORA", "Assessments Summary"]
    covered: true

  - id: q04
    question: "What are XBlocks?"
    expect: ["XBlocks"]
    covered: true

  - id: q05
    question: "How can learners work together in small groups?"
    expect: ["Teams"]
    covered: true

  - id: q06
    question: "What does the Poll component do?"
    expect: ["Polls"]
    covered: true

  - id: q07
    question: "How do I contribute to the open source community?"
    expect: ["Contribute"]
    covered: true

  - id: q08
    question: "What are content libraries used for?"
    expect: ["Content Libraries"]
    covered: true

  - id: q09
    question: "Where do I find the course outline?"
    expect: ["Course Outline"]
    covered: true

  - id: q10
    question: "What is conditional content?"
    expect: ["Conditional Content", "Content groups"]
    covered: true

  - id: q11
    question: "What assessment types does the platform offer?"
    expect: ["Assessments Summary", "ORA"]
    covered: true

  - id: q12
    question: "How do I configure advanced video settings?"
    expect: ["Advanced Video Settings", "Transcripts"]
    covered: true

  # --- NOT covered: the tutor must abstain, not improvise -------------------
  # These matter more than the covered ones. A tutor that answers everything
  # looks better in a demo and is worse in a course: a confidently wrong answer
  # costs a student more than an unnecessary "not covered" (§8.5).
  - id: q13
    question: "Explain quantum chromodynamics and colour confinement"
    expect: []
    covered: false

  - id: q14
    question: "What were the main causes of the French Revolution?"
    expect: []
    covered: false

  - id: q15
    question: "How do I file my income tax return in Germany?"
    expect: []
    covered: false

  - id: q16
    question: "What is the treatment protocol for myocardial infarction?"
    expect: []
    covered: false

  # --- adversarial: plausible-sounding but absent from THIS course ----------
  # Harder than random off-topic questions, because the vocabulary overlaps the
  # course domain. This is where a lexical retriever is most likely to return
  # something irrelevant with a high score.
  - id: q17
    question: "How do I configure single sign-on with SAML for my institution?"
    expect: []
    covered: false

  - id: q18
    question: "What is the pricing model for enterprise course licensing?"
    expect: []
    covered: false

  # --- PARAPHRASE SET: the same content, asked in the student's words -------
  #
  # Added 2026-08-05, and the reason is that the original 18 could no longer
  # measure anything. recall@3 = 1.000 on them, not because retrieval is
  # excellent but because the questions were written while looking at the
  # corpus and inherited its vocabulary. A gold set that only asks "what are
  # XBlocks?" of a lesson titled "XBlocks" tests string matching.
  #
  # Every question below deliberately AVOIDS the words the lesson uses, while
  # asking for the same thing a real student would want. That is the exact case
  # LIMITATIONS.md §1 names -- "what causes processes to hang forever?" will not
  # find a lesson that only says "deadlock" -- and until these existed there was
  # no way to justify embeddings by measurement rather than by argument.
  #
  # Expect these to score WORSE than q01-q12. That is the point: the number they
  # produce is the baseline a semantic retriever has to beat, and without a
  # baseline "we added embeddings and it felt better" is not a result.
  #
  # `paraphrase: true` so the harness can report them as their own arm rather
  # than averaging the weakness away against the easy questions.

  - id: p01
    question: "What helps deaf learners follow along with a recorded lecture?"
    expect: ["Transcripts", "Best Practices & Generating SRT Files"]
    covered: true
    paraphrase: true    # avoids: transcript, video, caption

  - id: p02
    question: "How do I split my class so different students see different material?"
    expect: ["Setting up Cohorts", "Content groups", "Conditional Content"]
    covered: true
    paraphrase: true    # avoids: cohort, group configuration

  - id: p03
    question: "Can students form their own study circles inside the course?"
    expect: ["Teams"]
    covered: true
    paraphrase: true    # avoids: team, small group, collaboration

  - id: p04
    question: "How do people add new kinds of interactive components to the platform?"
    expect: ["XBlocks", "Contribute"]
    covered: true
    paraphrase: true    # avoids: XBlock, architecture, extension

  - id: p05
    question: "How can I give each student a different question from a shared pool?"
    expect: ["Content Libraries"]
    covered: true
    paraphrase: true    # avoids: library, randomized

  - id: p06
    question: "How do I keep a section hidden until someone passes the one before it?"
    expect: ["Conditional Content"]
    covered: true
    paraphrase: true    # avoids: conditional, prerequisite, gating

  - id: p07
    question: "Where can I see everything in the class at a glance and how far I have got?"
    expect: ["Course Outline"]
    covered: true
    paraphrase: true    # avoids: outline, progress bar

  - id: p08
    question: "How can I give back to the project if I am not a programmer?"
    expect: ["Contribute"]
    covered: true
    paraphrase: true    # avoids: contribute, open source community

  - id: p09
    question: "How do I let the class pick a favourite option and then show the tally?"
    expect: ["Polls"]
    covered: true
    paraphrase: true    # avoids: poll, vote, survey

  - id: p10
    question: "How can students mark each other's written work?"
    expect: ["ORA", "Assessments Summary"]
    covered: true
    paraphrase: true    # avoids: open response assessment, peer grading, rubric
