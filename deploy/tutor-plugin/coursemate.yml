# CourseMate Tutor plugin.
#
#   cp coursemate.yml "$(tutor plugins printroot)"/
#   tutor plugins enable coursemate
#   tutor config save && tutor local start -d
#
# What this does, and why each piece is required by the architecture:
#
#  1. Runs the CourseMate service as its own container — OUTSIDE the Open edX
#     processes, so model latency and failures cannot touch the LMS (§3.4).
#
#  2. Routes /coursemate/* on the LMS host to that service. This is the piece
#     that makes v8's mint-and-connect topology work: the browser streams from a
#     SAME-ORIGIN path, so there is no CORS surface and no second published
#     hostname — and, decisively, the request is routed by Caddy and never
#     enters an LMS application process. No gunicorn worker is held open for the
#     duration of an answer.
#
#  3. Supplies the JWT signing key to the LMS/CMS so the XBlock can mint tokens.
#     Note what is NOT supplied: no model provider key. The XBlock makes no model
#     calls, so it has no reason to hold one (§10.4).
name: coursemate
version: 0.1.0

config:
  unique:
    # 64 chars. HS256 with a shorter secret is weaker than it looks, and
    # mint_student_token() refuses to sign with one (RFC 7518 §3.2).
    JWT_SIGNING_KEY: "{{ 64|random_string }}"
    SERVICE_CREDENTIAL: "{{ 64|random_string }}"
  defaults:
    # Provider strings in LiteLLM form. Swapping providers is configuration, not
    # a code change (§8.4) — e.g. openai/gpt-4o, gemini/gemini-2.0-flash,
    # ollama/llama3. FALLBACK should be a DIFFERENT vendor: that is what survives
    # one provider's outage, which a second model from the same vendor does not.
    STRONG_MODEL: "anthropic/claude-opus-5"
    CHEAP_MODEL: "anthropic/claude-haiku-4-5-20251001"
    MODEL_API_KEY: ""
    # A DIFFERENT vendor from STRONG_MODEL. A second model from the same
    # provider does not survive that provider's outage, which is the only thing
    # a fallback is for. Empty by default because guessing a vendor for someone
    # is worse than leaving it explicit -- but an empty value means the DEGRADED
    # frame can never fire and there is no failover at all.
    FALLBACK_MODEL: ""
    FALLBACK_API_KEY: ""
    # Base URLs for providers that are not at a well-known host: Ollama, vLLM, an
    # OpenAI-compatible gateway. Empty for hosted vendors, which need none.
    #
    # `OLLAMA_API_BASE` below already covers `ollama/*` because LiteLLM reads that
    # variable itself. These two are the provider-agnostic form, and they are the
    # ones `config.py` documents — so they have to exist here or that recipe is a
    # doc describing something the deployment cannot do.
    #
    # From a container, the host's Ollama is NOT `localhost`. Use
    # `http://host.docker.internal:11434` together with the `extra_hosts` entry
    # below, which is what makes that name resolve on Linux/WSL.
    MODEL_API_BASE: ""
    FALLBACK_API_BASE: ""
    # --- the exam-prep agent (Feature B) -------------------------------------
    # **Ships dark.** Read at the API layer, so `false` routes exam prep to the
    # deterministic study plan and no agent code is imported at all.
    #
    # It is exposed here because a kill switch nobody can reach is not a switch.
    # Turning it on required editing the generated docker-compose until this
    # existed, which is exactly the "control that must be switched on" problem
    # REQUIRE_GROUNDING already taught us, arriving from the other direction.
    AGENT_ENABLED: false
    # Shared state across replicas: rate limit, authz cache, LiteLLM cooldowns.
    # Points at the Redis every Tutor deployment already runs for Celery, so it
    # costs no new infrastructure. Empty falls back to per-process state, which
    # is correct for one replica and silently wrong for two.
    REDIS_URL: "redis://redis:6379/1"
    # Development only: returns a canned answer through the real Router without
    # calling a provider. Must be empty in production.
    MOCK_RESPONSE: ""
    # Retrieval landed in Phase 6, so this is true by default. It gates the
    # confidence gate, ABSTAINED and PREPARING — with it false a fresh install
    # answers from the model's own knowledge instead of the course, which is the
    # one behaviour this project exists to prevent. Turn it off only to debug
    # retrieval, never on an instance serving students.
    REQUIRE_GROUNDING: true
    # Open edX owns enrollment; the boundary re-derives it per call (§10.1).
    LMS_URL: "http://lms:8000"
    ENFORCE_ENROLLMENT: true
    LMS_CLIENT_ID: ""
    LMS_CLIENT_SECRET: ""
    # Base URL for a local Ollama, reached via the docker bridge. Empty for
    # hosted providers, which need no base URL.
    OLLAMA_API_BASE: ""
    # A 7B model on CPU takes tens of seconds to first token -- the design (§8.2)
    # predicted exactly this and is why the local model was deferred rather than
    # made the primary. Raised so a local model is usable for development.
    MODEL_TIMEOUT_SECONDS: 300
    RERANK_TOP_K: 3
    # Matches the service default. 250 was set for a CPU-bound local model and
    # then drifted to 200 in config.yml, which truncated answers mid-sentence
    # with no indication -- the DONE frame now carries `truncated` so that is at
    # least visible. Lower this deliberately for a slow local model; do not
    # leave it low by accident.
    MAX_OUTPUT_TOKENS: 800

patches:
  # --- the service container ------------------------------------------------
  local-docker-compose-services: |
    coursemate:
      image: coursemate/service:0.1.0
      restart: unless-stopped
      environment:
        COURSEMATE_TENANT: "default"
        COURSEMATE_JWT_SIGNING_KEY: "{{ COURSEMATE_JWT_SIGNING_KEY }}"
        COURSEMATE_SERVICE_CREDENTIAL: "{{ COURSEMATE_SERVICE_CREDENTIAL }}"
        COURSEMATE_STRONG_MODEL: "{{ COURSEMATE_STRONG_MODEL }}"
        COURSEMATE_CHEAP_MODEL: "{{ COURSEMATE_CHEAP_MODEL }}"
        COURSEMATE_MODEL_API_KEY: "{{ COURSEMATE_MODEL_API_KEY }}"
        COURSEMATE_FALLBACK_MODEL: "{{ COURSEMATE_FALLBACK_MODEL }}"
        COURSEMATE_FALLBACK_API_KEY: "{{ COURSEMATE_FALLBACK_API_KEY }}"
        COURSEMATE_MODEL_API_BASE: "{{ COURSEMATE_MODEL_API_BASE }}"
        COURSEMATE_FALLBACK_API_BASE: "{{ COURSEMATE_FALLBACK_API_BASE }}"
        COURSEMATE_AGENT_ENABLED: "{{ COURSEMATE_AGENT_ENABLED }}"
        COURSEMATE_REDIS_URL: "{{ COURSEMATE_REDIS_URL }}"
        COURSEMATE_MOCK_RESPONSE: "{{ COURSEMATE_MOCK_RESPONSE }}"
        COURSEMATE_REQUIRE_GROUNDING: "{{ COURSEMATE_REQUIRE_GROUNDING }}"
        COURSEMATE_INDEX_PATH: "/data/coursemate-index.db"
        # Explicit, not left to the default. The default happens to land in the
        # same mounted volume, but a past-paper pack cannot be rebuilt from the
        # modulestore the way the index can — only from the original PDFs — so
        # "it persists because a default coincides with a mount" is not a
        # property worth relying on silently.
        COURSEMATE_EXAMPREP_PATH: "/data/coursemate-examprep.db"
        COURSEMATE_LMS_URL: "{{ COURSEMATE_LMS_URL }}"
        COURSEMATE_ENFORCE_ENROLLMENT: "{{ COURSEMATE_ENFORCE_ENROLLMENT }}"
        COURSEMATE_LMS_CLIENT_ID: "{{ COURSEMATE_LMS_CLIENT_ID }}"
        COURSEMATE_LMS_CLIENT_SECRET: "{{ COURSEMATE_LMS_CLIENT_SECRET }}"
        OLLAMA_API_BASE: "{{ COURSEMATE_OLLAMA_API_BASE }}"
        COURSEMATE_MODEL_TIMEOUT_SECONDS: "{{ COURSEMATE_MODEL_TIMEOUT_SECONDS }}"
        COURSEMATE_RERANK_TOP_K: "{{ COURSEMATE_RERANK_TOP_K }}"
        COURSEMATE_MAX_OUTPUT_TOKENS: "{{ COURSEMATE_MAX_OUTPUT_TOKENS }}"
      volumes:
        # The index must outlive the container. Losing it is not data loss --
        # it can be rebuilt from the modulestore -- but an empty index makes the
        # tutor answer "still being prepared" for every question until someone
        # notices and re-runs the bootstrap.
        #
        # The exam-prep store lives here too, and for it the stakes are higher:
        # a past-paper pack CANNOT be rebuilt from the modulestore, only from the
        # original PDFs. This mount is the only thing keeping it.
        - ../../data/coursemate:/data
      # `host.docker.internal` does not resolve on Linux/WSL without this. It is
      # how the container reaches an Ollama running on the HOST, which is the
      # normal development setup -- the model is on the host so it can use the
      # host's memory and stay warm across container restarts.
      extra_hosts:
        - "host.docker.internal:host-gateway"

    # --- the nightly sweep needs something to schedule it ---------------------
    # Tutor runs no beat process. A CELERY_BEAT_SCHEDULE entry with no scheduler
    # reading it is not a nightly job, it is a comment — and the sweep is the only
    # mitigation for unpublished content, so "scheduled" has to mean scheduled.
    #
    # One beat container, CMS variant: the sweep reads the modulestore through
    # content_adapter, which is Studio-side.
    coursemate-beat:
      image: docker.io/overhangio/openedx:{{ OPENEDX_COMMON_VERSION_TAG | default("21.0.8-indigo") }}
      environment:
        SERVICE_VARIANT: cms
        DJANGO_SETTINGS_MODULE: cms.envs.tutor.production
      command:
        - "celery"
        - "--app=cms.celery"
        - "beat"
        - "--loglevel=info"
        # Schedule state on a writable path; the default lands in a read-only
        # working directory and beat exits on start.
        - "--schedule=/openedx/data/coursemate-beat-schedule"
      restart: unless-stopped
      volumes:
        - ../apps/openedx/settings/lms:/openedx/edx-platform/lms/envs/tutor:ro
        - ../apps/openedx/settings/cms:/openedx/edx-platform/cms/envs/tutor:ro
        - ../apps/openedx/config:/openedx/config:ro
        - ../../data/cms:/openedx/data
      depends_on:
        - cms-worker

  # --- same-origin route on the LMS host ------------------------------------
  # `handle` is terminal for matched requests and is evaluated before the bare
  # `reverse_proxy` that Tutor imports for the LMS, so /coursemate/* is served by
  # us and everything else still reaches the LMS untouched.
  caddyfile-lms: |
    handle /coursemate/* {
      reverse_proxy coursemate:8000 {
        # SSE requires unbuffered forwarding. Without flush_interval -1 Caddy
        # buffers the response and delivers it in one piece, which is
        # indistinguishable from a hung stream in the browser.
        flush_interval -1
        transport http {
          # Long enough for a full generation; the connection is held by Caddy
          # and the service, never by an LMS worker.
          response_header_timeout 300s
          read_timeout 300s
        }
      }
    }

  # --- settings the plugin package reads ------------------------------------
  openedx-common-settings: |
    COURSEMATE_JWT_SIGNING_KEY = "{{ COURSEMATE_JWT_SIGNING_KEY }}"
    COURSEMATE_SERVICE_CREDENTIAL = "{{ COURSEMATE_SERVICE_CREDENTIAL }}"
    COURSEMATE_STREAM_PATH = "/coursemate/api/chat"
    COURSEMATE_SERVICE_URL = "http://coursemate:8000"
    COURSEMATE_TENANT = "default"

  # --- the package must be IN the image, not copied into containers ---------
  # Learned the hard way. `docker cp` puts the code on sys.path but installs no
  # dist-info, so pip's `cms.djangoapp` / `lms.djangoapp` entry points are
  # absent — and those entry points are exactly how Open edX discovers a plugin
  # app. Without them the app never reaches INSTALLED_APPS, Django never loads
  # it, Celery never autodiscovers `coursemate_platform.tasks`, and every
  # enqueued task dies with "Received unregistered task". Publish still returns
  # 200, so nothing surfaces outside the worker's log.
  #
  # Both worker containers were in exactly that state: receivers fired in the
  # CMS web process (installed) and every task they enqueued was discarded by
  # the worker (not installed).
  openedx-dockerfile-post-python-requirements: |
    COPY --chown=app:app ./coursemate /openedx/coursemate
    RUN pip install --no-deps \
        /openedx/coursemate/packages/coursemate-contracts \
        /openedx/coursemate/packages/coursemate-platform
